[package]
name = "falcon"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
svm-intrinsics = { path = "../../svm-intrinsics" }
svm-rt = { path = "../svm-rt" }

[features]
debug = []
stage-hash = []
stage-decode = []

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"

[workspace]
