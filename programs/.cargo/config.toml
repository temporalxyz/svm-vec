# Build setup for sBPF v3 programs that use svm-intrinsics. Applies to every
# crate under programs/. Host crates are unaffected: everything below is
# scoped to the bpfel-unknown-none target or an explicit alias.
#
#   cargo +nightly build-sbpf     # -> target/bpfel-unknown-none/release/<crate>.so

[alias]
build-sbpf = ["build", "--release", "--target", "bpfel-unknown-none", "-Zbuild-std=core"]

[target.bpfel-unknown-none]
# The forked sbpf-linker, which runs the vector pass (relative to programs/).
linker = "../sbpf-linker/target/release/sbpf-linker"
rustflags = [
    "-C", "panic=abort",
    "-C", "relocation-model=static",
    "-C", "target-cpu=v4",
    "-C", "target-feature=+allows-misaligned-mem-access",
    "-C", "link-arg=--arch=v3",
    "-C", "link-arg=--llvm-args=--bpf-stack-size=4096",
    "-C", "link-arg=--llvm-args=--disable-movsx",
    "-C", "link-arg=--llvm-args=--disable-ldsx",
    "-C", "link-arg=--llvm-args=--disable-gotox",
    "-C", "link-arg=--llvm-args=--disable-bswap", # bswap is not sBPF, use be
    "--cfg=target_os=\"solana\"",
    "--cfg=target_feature=\"static-syscalls\"",
    "-A", "explicit_builtin_cfgs_in_flags",
]
